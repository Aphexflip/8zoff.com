name: Update and deploy site v2

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - index.html
      - CNAME
      - videos.json
      - tools/build_videos.py
      - tests/test_build_videos.py
      - .github/workflows/update-site-v2.yml
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: read

concurrency:
  group: pages-v2
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Check out repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.x"

      - name: Test resilient video builder
        run: python -m unittest discover -s tests -p "test_*.py" -v

      - name: Build site files
        run: |
          set -euo pipefail
          mkdir -p dist
          cp index.html dist/index.html
          cp CNAME dist/CNAME
          python tools/build_videos.py --output dist/videos.json
          touch dist/.nojekyll
          test -s dist/index.html
          test -s dist/videos.json

      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
