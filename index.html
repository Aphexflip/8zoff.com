<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Zoff | Roblox Shorts</title>

<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: linear-gradient(#0a0f1c, #111827);
  color: white;
}

/* 🔥 TOP BAR */
.top-bar {
  position: sticky;
  top: 0;
  width: 100%;
  background: #00c6ff;
  text-align: center;
  padding: 10px;
  font-weight: bold;
  z-index: 1000;
}

.top-bar a {
  color: white;
  text-decoration: none;
}

/* HEADER */
header {
  padding: 25px;
  text-align: center;
  background: linear-gradient(90deg, #4facfe, #00f2fe);
  font-size: 32px;
  font-weight: bold;
}

.subtext {
  font-size: 14px;
}

.subscribe-btn {
  margin-top: 10px;
  display: inline-block;
  padding: 10px 20px;
  background: #4facfe;
  border-radius: 10px;
  color: white;
  text-decoration: none;
  font-weight: bold;
}

/* GRID */
.grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
  gap: 15px;
  padding: 20px;
}

/* CARD */
.card {
  position: relative;
  cursor: pointer;
  transition: 0.25s;
}

.card:hover {
  transform: scale(1.08);
  box-shadow: 0 0 15px #4facfe;
}

.card img {
  width: 100%;
  border-radius: 14px;
  aspect-ratio: 9/16;
  object-fit: cover;
}

/* PLAY ICON */
.play {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  font-size: 32px;
  background: rgba(0,0,0,0.6);
  border-radius: 50%;
  padding: 8px 12px;
  color: #4facfe;
}

/* MODAL */
.modal {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: rgba(0,0,0,0.95);
  display: none;
  justify-content: center;
  align-items: center;
}

.modal iframe {
  width: 90%;
  max-width: 400px;
  height: 70%;
}

.close {
  position: absolute;
  top: 20px;
  right: 20px;
  font-size: 30px;
  cursor: pointer;
}

/* FOOTER */
footer {
  text-align: center;
  padding: 20px;
  font-size: 12px;
  color: #888;
}
</style>
</head>

<body>

<!-- 💰 AMAZON BAR -->
<div class="top-bar">
🎮 Roblox Gift Cards 👉 
<a href="https://amzn.to/4c4zWPA" target="_blank" rel="nofollow sponsored">
Get Yours
</a>
</div>

<header>
🔥 ZOFF 🔥
<div class="subtext">Roblox chaos & insane moments</div>

<a class="subscribe-btn" href="https://www.youtube.com/@8zoff" target="_blank">
Subscribe
</a>
</header>

<!-- VIDEO GRID -->
<div class="grid" id="videoGrid"></div>

<footer>
© Zoff  
<br><br>
As an Amazon Associate, I earn from qualifying purchases.
</footer>

<!-- MODAL -->
<div class="modal" id="modal">
<span class="close" onclick="closeVideo()">✖</span>
<iframe id="player" src="" frameborder="0"></iframe>
</div>

<script>
const API_KEY = "AIzaSyAhWITFUBveF-dHZBDSYCY7o-zst-lmxrY";
const CHANNEL_ID = "UCfa5-QhuRmRa7eMIx9fsepQ";

let nextPageToken = "";
let isLoading = false;
let loadCount = 0;
const MAX_LOADS = 5;

async function loadVideos() {
  if (isLoading) return;
  if (loadCount >= MAX_LOADS) return;

  isLoading = true;

  let url = `https://www.googleapis.com/youtube/v3/search?key=${API_KEY}&channelId=${CHANNEL_ID}&part=snippet,id&order=date&maxResults=8`;

  if (nextPageToken) {
    url += `&pageToken=${nextPageToken}`;
  }

  const res = await fetch(url);
  const data = await res.json();

  nextPageToken = data.nextPageToken || "";

  const grid = document.getElementById("videoGrid");

  data.items.forEach(video => {
    if (video.id.videoId) {
      const id = video.id.videoId;

      const card = document.createElement("div");
      card.className = "card";
      card.onclick = () => openVideo(id);

      card.innerHTML = `
        <img src="https://img.youtube.com/vi/${id}/hqdefault.jpg">
        <div class="play">▶</div>
      `;

      grid.appendChild(card);
    }
  });

  loadCount++;
  isLoading = false;
}

/* MODAL */
function openVideo(id) {
  document.getElementById("modal").style.display = "flex";
  document.getElementById("player").src = `https://www.youtube.com/embed/${id}?autoplay=1`;
}

function closeVideo() {
  document.getElementById("modal").style.display = "none";
  document.getElementById("player").src = "";
}

/* INFINITE SCROLL */
window.addEventListener("scroll", () => {
  if (window.innerHeight + window.scrollY >= document.body.offsetHeight - 300) {
    loadVideos();
  }
});

loadVideos();
</script>

</body>
</html>
