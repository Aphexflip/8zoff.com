<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Zoff | Roblox Shorts</title>
<meta name="description" content="Watch Zoff's Roblox Shorts. Funny moments, chaos, and insane gameplay.">

<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #0d0d0d;
  color: white;
  text-align: center;
}

header {
  padding: 40px 20px;
  background: linear-gradient(90deg, #ff0000, #ff6600);
  font-size: 36px;
  font-weight: bold;
}

.subtext {
  font-size: 18px;
  margin-top: 10px;
}

.subscribe-btn {
  display: inline-block;
  margin-top: 20px;
  padding: 14px 30px;
  background: red;
  color: white;
  text-decoration: none;
  border-radius: 12px;
  font-weight: bold;
}

.section {
  padding: 30px 20px;
}

.grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
  gap: 20px;
  padding: 20px;
}

.card {
  position: relative;
  cursor: pointer;
  transition: 0.2s;
}

.card:hover {
  transform: scale(1.07);
}

.card img {
  width: 100%;
  border-radius: 14px;
}

.play {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  font-size: 42px;
  background: rgba(0,0,0,0.6);
  border-radius: 50%;
  padding: 10px 15px;
}

.caption {
  margin-top: 8px;
  font-size: 14px;
}

.footer {
  padding: 20px;
  font-size: 14px;
  color: #888;
}
</style>
</head>

<body>

<header>
🔥 ZOFF 🔥
<div class="subtext">Roblox chaos, funny moments, and insane gameplay</div>

<a class="subscribe-btn" href="https://www.youtube.com/@8zoff" target="_blank">
Subscribe on YouTube
</a>
</header>

<div class="section">
<h2>🔥 Latest Videos</h2>
<div class="grid" id="videoGrid"></div>
</div>

<div class="section">
<h2>🚀 About Zoff</h2>
<p>
Zoff creates fast, chaotic Roblox Shorts packed with funny moments and wild gameplay.
If you like quick laughs and crazy clips, you're in the right place.
</p>
</div>

<div class="footer">
© Zoff
</div>

<script>
const API_KEY = "AIzaSyAhWITFUBveF-dHZBDSYCY7o-zst-lmxrY";
const CHANNEL_ID = "UCfa5-QhuRmRa7eMIx9fsepQ";

async function loadVideos() {
  const url = `https://www.googleapis.com/youtube/v3/search?key=${API_KEY}&channelId=${CHANNEL_ID}&part=snippet,id&order=date&maxResults=8`;

  const res = await fetch(url);
  const data = await res.json();

  const grid = document.getElementById("videoGrid");

  data.items.forEach(video => {
    if (video.id.videoId) {
      const id = video.id.videoId;

      const card = document.createElement("div");
      card.className = "card";
      card.onclick = () => window.open(`https://youtube.com/watch?v=${id}`, "_blank");

      card.innerHTML = `
        <img src="https://img.youtube.com/vi/${id}/hqdefault.jpg">
        <div class="play">▶</div>
        <div class="caption">${video.snippet.title}</div>
      `;

      grid.appendChild(card);
    }
  });
}

loadVideos();
</script>

</body>
</html>
