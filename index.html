<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Zoff | Roblox Videos</title>
<meta name="description" content="Watch Zoff's Roblox videos. Funny moments, chaos, and insane gameplay.">

<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #0d0d0d;
  color: white;
}

header {
  padding: 30px;
  text-align: center;
  background: linear-gradient(90deg, #ff0000, #ff6600);
  font-size: 34px;
  font-weight: bold;
}

.subtext {
  font-size: 16px;
  margin-top: 10px;
}

.subscribe-btn {
  display: inline-block;
  margin-top: 15px;
  padding: 12px 25px;
  background: red;
  color: white;
  text-decoration: none;
  border-radius: 10px;
  font-weight: bold;
}

.section {
  padding: 20px;
}

h2 {
  margin-left: 10px;
}

.row {
  display: flex;
  overflow-x: auto;
  gap: 15px;
  padding: 15px;
}

.card {
  min-width: 180px;
  flex: 0 0 auto;
  cursor: pointer;
  transition: 0.2s;
}

.card:hover {
  transform: scale(1.07);
}

.card img {
  width: 100%;
  border-radius: 12px;
}

.play {
  position: absolute;
  transform: translate(-50%, -50%);
}

.caption {
  font-size: 14px;
  margin-top: 5px;
}

.row::-webkit-scrollbar {
  height: 8px;
}

.row::-webkit-scrollbar-thumb {
  background: #444;
  border-radius: 10px;
}

.footer {
  text-align: center;
  padding: 20px;
  color: #888;
}
</style>
</head>

<body>

<header>
🔥 ZOFF 🔥
<div class="subtext">Roblox chaos, funny moments, and insane gameplay</div>

<a class="subscribe-btn" href="https://www.youtube.com/@8zoff" target="_blank">
Subscribe on YouTube
</a>
</header>

<div class="section">
<h2>🔥 Latest Uploads</h2>
<div class="row" id="latestRow"></div>
</div>

<div class="section">
<h2>🚀 More From Zoff</h2>
<div class="row" id="moreRow"></div>
</div>

<div class="section">
<h2>🎮 Even More Chaos</h2>
<div class="row" id="extraRow"></div>
</div>

<div class="footer">
© Zoff
</div>

<script>
const API_KEY = "AIzaSyAhWITFUBveF-dHZBDSYCY7o-zst-lmxrY";
const CHANNEL_ID = "UCfa5-QhuRmRa7eMIx9fsepQ";

async function loadVideos() {
  const url = `https://www.googleapis.com/youtube/v3/search?key=${API_KEY}&channelId=${CHANNEL_ID}&part=snippet,id&order=date&maxResults=20`;

  const res = await fetch(url);
  const data = await res.json();

  const latest = document.getElementById("latestRow");
  const more = document.getElementById("moreRow");
  const extra = document.getElementById("extraRow");

  let count = 0;

  data.items.forEach(video => {
    if (video.id.videoId) {
      const id = video.id.videoId;

      const card = document.createElement("div");
      card.className = "card";
      card.onclick = () => window.open(`https://youtube.com/watch?v=${id}`, "_blank");

      card.innerHTML = `
        <img src="https://img.youtube.com/vi/${id}/hqdefault.jpg">
        <div class="caption">${video.snippet.title}</div>
      `;

      if (count < 6) {
        latest.appendChild(card);
      } else if (count < 12) {
        more.appendChild(card);
      } else {
        extra.appendChild(card);
      }

      count++;
    }
  });
}

loadVideos();
</script>

</body>
</html>
