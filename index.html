<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Zoff | Roblox Shorts</title>

<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: linear-gradient(#0a0f1c, #111827);
  color: white;
}

/* TOP BAR */
.top-bar {
  position: sticky;
  top: 0;
  width: 100%;
  background: #00c6ff;
  text-align: center;
  padding: 10px;
  font-weight: bold;
  z-index: 1000;
}
.top-bar a { color: white; text-decoration: none; }

/* HEADER */
header {
  padding: 25px;
  text-align: center;
  background: linear-gradient(90deg, #4facfe, #00f2fe);
  font-size: 32px;
}

/* GRID */
.grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
  gap: 15px;
  padding: 20px;
}

/* CARD */
.card {
  cursor: pointer;
  transition: 0.25s;
}
.card:hover {
  transform: scale(1.08);
  box-shadow: 0 0 15px #4facfe;
}
.card img {
  width: 100%;
  border-radius: 14px;
  aspect-ratio: 9/16;
  object-fit: cover;
}

/* MID MONEY BLOCK */
.money-block {
  margin: 20px;
  padding: 20px;
  background: #1a2333;
  text-align: center;
  border-radius: 12px;
}

/* STICKY CTA */
.sticky-cta {
  position: fixed;
  bottom: 0;
  width: 100%;
  background: #00c6ff;
  text-align: center;
  padding: 12px;
  font-weight: bold;
}
.sticky-cta a {
  color: white;
  text-decoration: none;
}

/* MODAL */
.modal {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: rgba(0,0,0,0.95);
  display: none;
  justify-content: center;
  align-items: center;
}
.modal iframe {
  width: 90%;
  max-width: 400px;
  height: 70%;
}
.close {
  position: fixed;
  top: 70px;
  right: 20px;
  font-size: 30px;
  cursor: pointer;
  z-index: 2000;
}

footer {
  text-align: center;
  padding: 60px 20px 100px;
  font-size: 12px;
}
</style>
</head>

<body>

<!-- TOP BAR -->
<div class="top-bar">
🎮 Roblox Gift Cards 👉 
<a href="https://amzn.to/4c4zWPA" target="_blank" rel="nofollow sponsored">
Get Yours
</a>
</div>

<header>
🔥 ZOFF 🔥
</header>

<div class="grid" id="videoGrid"></div>

<!-- MID MONEY -->
<div class="money-block">
<h2>🎮 Get Roblox Gift Cards</h2>
<a href="https://amzn.to/4c4zWPA" target="_blank" rel="nofollow sponsored">
🔥 Click Here
</a>
</div>

<footer>
© Zoff  
<br><br>
As an Amazon Associate, I earn from qualifying purchases.
</footer>

<!-- STICKY CTA -->
<div class="sticky-cta">
🎮 Need Robux? 👉 
<a href="https://amzn.to/4c4zWPA" target="_blank" rel="nofollow sponsored">
Get Gift Cards
</a>
</div>

<!-- MODAL -->
<div class="modal" id="modal">
<span class="close" onclick="closeVideo()">✖</span>
<iframe id="player"></iframe>
</div>

<script>

// RSS FEED
const FEED_URL = "https://api.allorigins.win/raw?url=" + encodeURIComponent(
  "https://www.youtube.com/feeds/videos.xml?channel_id=UCfa5-QhuRmRa7eMIx9fsepQ"
);

let allVideos = [];
let loadedCount = 0;
const LOAD_BATCH = 8;

// LOAD FEED
async function loadFeed() {
  const res = await fetch(FEED_URL);
  const text = await res.text();

  const parser = new DOMParser();
  const xml = parser.parseFromString(text, "text/xml");

  const entries = xml.getElementsByTagName("entry");

  for (let i = 0; i < entries.length; i++) {
    const id = entries[i].getElementsByTagName("yt:videoId")[0].textContent;
    allVideos.push(id);
  }

  // 🔥 LOAD MULTIPLE BATCHES UP FRONT
  loadMore();
  loadMore(); // now 16 videos instantly
}

// LOAD MORE
function loadMore() {
  const grid = document.getElementById("videoGrid");

  for (let i = 0; i < LOAD_BATCH; i++) {
    if (loadedCount >= allVideos.length) return;

    const id = allVideos[loadedCount];

    const card = document.createElement("div");
    card.className = "card";
    card.onclick = () => openVideo(id);

    card.innerHTML = `
      <img src="https://img.youtube.com/vi/${id}/hqdefault.jpg">
    `;

    grid.appendChild(card);
    loadedCount++;
  }
}

// MODAL
function openVideo(id) {
  document.getElementById("modal").style.display = "flex";
  document.getElementById("player").src = `https://www.youtube.com/embed/${id}?autoplay=1`;
}

function closeVideo() {
  document.getElementById("modal").style.display = "none";
  document.getElementById("player").src = "";
}

// 🔥 BETTER SCROLL DETECTION
window.addEventListener("scroll", () => {
  if ((window.innerHeight + window.scrollY) >= (document.body.offsetHeight - 200)) {
    loadMore();
  }
});

loadFeed();

</script><script>

</body>
</html>
