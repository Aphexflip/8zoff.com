<script>

// 🔥 PRIMARY + BACKUP PROXIES
const FEED_URLS = [
  "https://api.allorigins.win/raw?url=" + encodeURIComponent("https://www.youtube.com/feeds/videos.xml?channel_id=UCfa5-QhuRmRa7eMIx9fsepQ"),
  "https://cors.isomorphic-git.org/https://www.youtube.com/feeds/videos.xml?channel_id=UCfa5-QhuRmRa7eMIx9fsepQ"
];

const CACHE_KEY = "zoff_feed";
const CACHE_TIME = 10 * 60 * 1000; // 10 minutes

const grid = document.getElementById("videoGrid");

// 🔥 LOADING MESSAGE
grid.innerHTML = "<p style='text-align:center;width:100%'>Loading videos...</p>";

async function fetchFeed() {
  for (let url of FEED_URLS) {
    try {
      const res = await fetch(url);
      const text = await res.text();
      return text;
    } catch (err) {
      console.warn("Proxy failed, trying next...");
    }
  }
  throw new Error("All proxies failed");
}

async function loadVideos() {

  // 🔥 CACHE FIRST
  const cached = localStorage.getItem(CACHE_KEY);
  if (cached) {
    const parsed = JSON.parse(cached);
    if (Date.now() - parsed.time < CACHE_TIME) {
      buildGrid(parsed.videos);
      return;
    }
  }

  try {
    const text = await fetchFeed();

    const parser = new DOMParser();
    const xml = parser.parseFromString(text, "text/xml");

    const entries = xml.getElementsByTagName("entry");

    let videos = [];

    for (let i = 0; i < entries.length; i++) {
      const id = entries[i].getElementsByTagName("yt:videoId")[0].textContent;
      videos.push(id);
    }

    // SAVE CACHE
    localStorage.setItem(CACHE_KEY, JSON.stringify({
      time: Date.now(),
      videos: videos
    }));

    buildGrid(videos);

  } catch (err) {
    console.error(err);
    grid.innerHTML = "<p style='text-align:center;width:100%'>Failed to load videos. Refresh.</p>";
  }
}

function buildGrid(videos) {
  grid.innerHTML = "";

  videos.forEach(id => {
    const card = document.createElement("div");
    card.className = "card";
    card.onclick = () => openVideo(id);

    card.innerHTML = `
      <img src="https://img.youtube.com/vi/${id}/hqdefault.jpg">
    `;

    grid.appendChild(card);
  });
}

// MODAL
function openVideo(id) {
  document.getElementById("modal").style.display = "flex";
  document.getElementById("player").src = `https://www.youtube.com/embed/${id}?autoplay=1`;
}

function closeVideo() {
  document.getElementById("modal").style.display = "none";
  document.getElementById("player").src = "";
}

loadVideos();

</script>
